name: Publish approved September 23 batch
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: research-led-sep23-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/2026-09-23-research-led
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Set receipt author
        run: |
          git config user.name ig-accounts-bot
          git config user.email actions@users.noreply.github.com
      - name: Validate approved assets
        run: python batches/2026-09-23-research-led/publish_batch.py --dry-run
      - name: Publish exact nine-post batch
        run: python batches/2026-09-23-research-led/publish_batch.py
        env:
          IG_ACCESS_TOKEN_HYPE_TINGLES: ${{ secrets.IG_ACCESS_TOKEN_HYPE_TINGLES }}
          IG_USER_ID_HYPE_TINGLES: ${{ secrets.IG_USER_ID_HYPE_TINGLES }}
          IG_ACCESS_TOKEN_ANIME_EKAYA: ${{ secrets.IG_ACCESS_TOKEN_ANIME_EKAYA }}
          IG_USER_ID_ANIME_EKAYA: ${{ secrets.IG_USER_ID_ANIME_EKAYA }}
          IG_ACCESS_TOKEN_NUVAREL: ${{ secrets.IG_ACCESS_TOKEN_NUVAREL }}
          IG_USER_ID_NUVAREL: ${{ secrets.IG_USER_ID_NUVAREL }}
          IG_AUTH_MODE: ${{ vars.IG_AUTH_MODE || 'instagram_login' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: september23-publication-receipts
          path: batches/2026-09-23-research-led/receipts.json
          if-no-files-found: ignore
