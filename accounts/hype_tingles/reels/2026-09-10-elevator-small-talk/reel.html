<!doctype html><html><head><meta charset="utf-8"><style>
/* hype_tingles "elevator small talk" -- 2D stickman POV meme cut (~14.6s).
   Topic wheel: small talk (12 floors, one coworker). Emergency same-day
   build 2026-09-10 (nothing queued since 09-05); trend search unavailable
   in this session, so Step 3 fallback (topic wheel) applies.
   Scene set: elevator car, front-view cutaway, doors in the BACK wall
   (rear-exit car) so the door open/close and the doorway collision are
   fully visible while both faces stay on camera. Hero prop: the floor
   indicator. No overlap with the last 7 days' sets (office/coffee
   machine, street/shop/bags, table/phone/cat).
   Principle map: ANTICIPATION = the elevator-start dip (0.90), the
   lean-away windup before the dash (9.90-10.15), the two-dip nod (5.55);
   SQUASH&STRETCH = start/stop jolts (6%), stride stretch on the dash,
   the doorway collision (18% sideways squash, pivot at the contact edge,
   4-frame hold, fast recovery into the squeeze-through); COMEDIC HOLDS =
   dead-eye forward stare with the indicator stalled on 4 (3.10-4.90,
   one blink at 4.15), the watch-check / eye-wander hold (6.95-9.60), the
   empty car after they bolt (10.80-11.65), cat-verdict hold (12.10-13.30).
   Quality ratchet vs. the last 3 Reels (pre-coffee, salary-day, hold &
   judge): FOLLOW-THROUGH / OVERLAPPING ACTION -- each character wears a
   lanyard + ID badge that hangs from the neck and lags the body as a
   deterministic damped pendulum (impulse responses at the start jolt, the
   stop bump, the dash launch and the collision), so every hit has a
   secondary motion that settles AFTER the primary. First time this rig
   has a secondary-motion channel; mouth shapes from salary-day kept. */
@font-face { font-family:'Archivo Black'; src:url('../../brand/fonts/archivo-black-400.woff2') format('woff2'); font-weight:400; }
@font-face { font-family:'Space Grotesk'; src:url('../../brand/fonts/space-grotesk-400.woff2') format('woff2'); font-weight:400; }
@font-face { font-family:'Space Grotesk'; src:url('../../brand/fonts/space-grotesk-500.woff2') format('woff2'); font-weight:500; }
@font-face { font-family:'Space Grotesk'; src:url('../../brand/fonts/space-grotesk-700.woff2') format('woff2'); font-weight:700; }

:root { --ink:#111015; --volt:#D8FF3A; --pink:#FF4D9D; --paper:#F4F2EC; --soft:#9A96A3; --panel:#1B1922; --line:#2A2733; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1920px; overflow:hidden; }
body { background:var(--ink); color:var(--paper); font-family:'Space Grotesk',Arial,sans-serif; position:relative; }
body::before { content:""; position:absolute; width:1100px; height:1100px; left:-480px; top:-480px;
  background:radial-gradient(circle, rgba(216,255,58,0.10) 0%, rgba(216,255,58,0) 62%); pointer-events:none; z-index:0; }

#cam { position:absolute; inset:0; z-index:1; }
svg { position:absolute; inset:0; }
#flash { position:absolute; inset:0; z-index:4; background:var(--volt); opacity:0; pointer-events:none; }
#ui { position:absolute; inset:0; z-index:5; }
.snap { visibility:hidden; will-change:transform; }

/* POV title (top overlay) */
#title { position:absolute; top:150px; left:60px; right:60px; transform-origin:50% 50%; }
#title .tag { display:inline-block; background:var(--volt); color:var(--ink); font-family:'Archivo Black';
  font-size:40px; padding:10px 26px; border-radius:12px; letter-spacing:.06em; }
#title .txt { margin-top:18px; background:var(--panel); border:5px solid var(--line); border-radius:22px;
  padding:28px 34px; font-family:'Archivo Black'; font-size:60px; line-height:1.14; color:var(--paper);
  text-shadow:0 5px 0 rgba(0,0,0,.4); }
#title .txt .hl { color:var(--pink); }

/* speech bubbles (paper on ink, tail toward the speaker) */
.bub { position:absolute; background:var(--paper); color:var(--ink); border-radius:26px; padding:18px 30px 20px;
  font-weight:700; font-size:42px; line-height:1.1; white-space:nowrap; transform-origin:20% 100%; box-shadow:0 8px 0 rgba(0,0,0,.35); }
.bub::after { content:""; position:absolute; bottom:-22px; left:44px; border:14px solid transparent; border-top-color:var(--paper); border-bottom:0; }
.bub.r { transform-origin:80% 100%; }
.bub.r::after { left:auto; right:44px; }
#bubA1 { left:210px; top:820px; }
#bubB1 { left:700px; top:820px; }
#bubA2 { left:150px; top:820px; }
#bubB2 { left:716px; top:820px; }

.stamp { position:absolute; left:110px; right:110px; background:var(--panel); border:6px solid var(--volt);
  border-radius:30px; padding:24px 36px 26px; transform-origin:50% 50%; box-shadow:0 14px 0 rgba(0,0,0,.4); }
.stamp .who { display:flex; align-items:center; gap:22px; }
.stamp .em { font-size:64px; line-height:1; font-family:'Segoe UI Emoji'; }
.stamp .name { font-family:'Archivo Black'; font-size:34px; letter-spacing:.05em; color:var(--volt); }
.stamp .line { font-weight:700; font-size:44px; line-height:1.16; margin-top:14px; }
.stamp .line .accent { color:var(--pink); }
/* stamps sit below the floor indicator (ends y~600) and above the heads (top ~965) */
#stampDog { top:630px; border-color:var(--volt); }
#stampOwl { top:630px; border-color:var(--pink); }

#catCard { position:absolute; left:90px; right:90px; top:460px; background:var(--panel); border:3px solid var(--line);
  border-radius:36px; padding:60px 56px; transform-origin:50% 0%; }
#catCard .who { display:flex; align-items:center; gap:30px; }
#catCard .em { font-size:104px; line-height:1; font-family:'Segoe UI Emoji'; }
#catCard .name { font-family:'Archivo Black'; font-size:42px; color:var(--volt); letter-spacing:.05em; }
#catCard .role { font-size:27px; color:var(--soft); font-weight:500; letter-spacing:.14em; text-transform:uppercase; margin-top:8px; }
#catCard .line { font-weight:700; font-size:64px; line-height:1.22; margin-top:44px; }
#catCard .line .accent { color:var(--pink); }

#endcard { position:absolute; inset:0; background:var(--ink); z-index:8; visibility:hidden; }
#endcard .wm { font-family:'Archivo Black'; font-size:92px; color:var(--volt); text-align:center; margin-top:600px; }
#endcard .wm .tingle { color:var(--pink); }
#endcard .tag2 { text-align:center; font-weight:700; font-size:46px; color:var(--paper); margin-top:56px; }
#endcard svg { position:absolute; left:0; bottom:0; width:1080px; height:600px; inset:auto; }
</style></head><body>

<div id="cam">
  <svg id="stage" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
</div>
<div id="flash"></div>

<div id="ui">
  <div id="title" class="snap"><span class="tag">POV</span>
    <div class="txt">12 floors. <span class="hl">One coworker.</span></div></div>

  <div id="bubA1" class="bub snap">So. Busy day?</div>
  <div id="bubB1" class="bub r snap">Yep.</div>
  <div id="bubA2" class="bub snap">Weather is weather, huh.</div>
  <div id="bubB2" class="bub r snap">Mm.</div>

  <div id="stampDog" class="stamp snap">
    <div class="who"><div class="em">&#128021;</div><div class="name">DOG</div></div>
    <div class="line">I would talk weather <span class="accent">for 100 floors!!</span></div>
  </div>
  <div id="stampOwl" class="stamp snap">
    <div class="who"><div class="em">&#129417;</div><div class="name">OWL</div></div>
    <div class="line">Studies say the ride is 40 seconds. <span class="accent">It has been 40 years.</span></div>
  </div>

  <div id="catCard" class="snap">
    <div class="who"><div class="em">&#128008;</div><div><div class="name">CAT</div><div class="role">Final verdict</div></div></div>
    <div class="line">Take <span class="accent">the stairs.</span></div>

  <div id="endcard">
    <div class="wm">HYPE<span class="tingle"> TINGLES</span></div>
    <div class="tag2">The cat has spoken.</div>
    <svg id="endsvg" viewBox="0 0 1080 600"></svg>
  </div>
</div>

<script src="../../../../assets/rig2d.js"></script>
<script>
"use strict";
/* ============================ beat table ============================ */
const B = {
  title: -0.30,                 // landed before frame 0: frame 0 is the Reels cover
  ding1: 0.05,
  doorsClose: [0.10, 0.70],
  go: 0.90,                     // car starts: dip jolt (ANTICIPATION-shaped settle), lanyards swing
  turnA: [1.35, 1.60],          // A turns to B
  bubA1: 1.70,
  turnB: [2.15, 2.35],          // B half-turns back
  bubB1: 2.45,
  fwd: [2.85, 3.10],            // both face forward again
  hold1: [3.10, 4.90],          // COMEDIC HOLD #1: dead eyes, indicator stalled on 4
  dead: 3.35,
  blink: 4.15,
  bubA2: 4.95,
  nod: [5.55, 5.90],            // B: two-dip nod (ANTICIPATION-shaped)
  bubB2: 5.70,
  fwd2: [6.05, 6.25],
  dogStamp: 6.30,
  watch: [6.70, 6.95],          // A raises the wrist, checks a watch
  wander: [7.00, 9.40],         // B's eyes drift anywhere but at A
  owlStamp: 7.80,
  stop: 9.72,                   // car stops: bump
  ding2: 9.80,                  // volt flash
  doorsOpen: [9.85, 10.12],
  wind: [9.90, 10.15],          // ANTICIPATION: both lean AWAY from the door before the dash
  dash: [10.15, 10.42],         // both sprint for the same doorway
  hit: 10.42,                   // SQUASH: doorway collision, 4-frame hold
  hitHold: [10.42, 10.55],
  squeeze: [10.55, 10.82],      // both wedge through together, shrinking into the corridor
  empty: [10.82, 11.65],        // COMEDIC HOLD: empty car, doors slowly close again
  doorsClose2: [11.10, 11.60],
  catCard: 11.70,
  hold2: [12.10, 13.30],        // COMEDIC HOLD: verdict sits
  endcard: 13.50,
  end: 14.60
};
// floor indicator ticks: [time, floor]. 2-4 brisk, stall on 4, slow 5-9, then relief accelerando 10-12
const TICKS = [[1.50, 2], [2.10, 3], [2.70, 4], [4.60, 5], [5.60, 6], [6.60, 7], [7.60, 8], [8.60, 9], [9.15, 10], [9.40, 11], [9.62, 12]];
window.BEATS = B; window.TICKS = TICKS;
window.REEL = { duration: B.end, fps: 30 };

const stage = document.getElementById("stage");
const C = { paper:"#F4F2EC", soft:"#9A96A3", volt:"#D8FF3A", pink:"#FF4D9D", panel:"#1B1922", line:"#2A2733", ink:"#111015" };

/* ============================ scenery ============================ */
const bgflip = makeFlipRect(stage);
const sceneG = el(stage, "g", {});

// car interior: back wall, ceiling band, floor
el(sceneG, "rect", { x:90, y:440, width:900, height:1060, fill:"#1A1820" });
el(sceneG, "rect", { x:90, y:440, width:900, height:34, fill:"#221F2B" });                       // ceiling cove
const lamp = el(sceneG, "rect", { x:420, y:446, width:240, height:16, rx:8, fill:"#EDE9DA", opacity:0.9 }); // ceiling light strip
el(sceneG, "rect", { x:0, y:1500, width:1080, height:420, fill:"#161419" });
el(sceneG, "line", { x1:0, y1:1500, x2:1080, y2:1500, stroke:C.line, "stroke-width":6 });
// side walls (dark trapezoids) so the car reads as a box, not a card
el(sceneG, "path", { d:"M 0 380 L 90 440 L 90 1500 L 0 1560 Z", fill:"#141218" });
el(sceneG, "path", { d:"M 1080 380 L 990 440 L 990 1500 L 1080 1560 Z", fill:"#141218" });
el(sceneG, "line", { x1:90, y1:440, x2:90, y2:1500, stroke:C.line, "stroke-width":5 });
el(sceneG, "line", { x1:990, y1:440, x2:990, y2:1500, stroke:C.line, "stroke-width":5 });

// corridor behind the doorway (seen when the doors are open)
el(sceneG, "rect", { x:370, y:640, width:340, height:860, fill:"#0B0A0E" });
el(sceneG, "line", { x1:370, y1:1290, x2:710, y2:1290, stroke:"#221F2B", "stroke-width":8 });   // corridor skirting line
el(sceneG, "rect", { x:470, y:690, width:140, height:44, rx:8, fill:"#0B0A0E", stroke:C.pink, "stroke-width":4 });
el(sceneG, "text", { x:540, y:722, "text-anchor":"middle", fill:C.pink, "font-family":"Archivo Black", "font-size":26, "letter-spacing":3 }).textContent = "EXIT";

// door panels (clipped to the doorway; they retract behind the wall when open)
const defs = el(stage, "defs", {});
const clip = el(defs, "clipPath", { id:"doorClip" });
el(clip, "rect", { x:370, y:640, width:340, height:860 });
const doorsG = el(sceneG, "g", { "clip-path":"url(#doorClip)" });
const doorL = el(doorsG, "g", {});
el(doorL, "rect", { x:370, y:640, width:170, height:860, fill:"#26232E" });
el(doorL, "line", { x1:536, y1:640, x2:536, y2:1500, stroke:C.paper, "stroke-width":5 });
el(doorL, "line", { x1:400, y1:700, x2:400, y2:1440, stroke:"#302C3A", "stroke-width":6 });     // brushed panel groove
const doorR = el(doorsG, "g", {});
el(doorR, "rect", { x:540, y:640, width:170, height:860, fill:"#26232E" });
el(doorR, "line", { x1:544, y1:640, x2:544, y2:1500, stroke:C.paper, "stroke-width":5 });
el(doorR, "line", { x1:680, y1:700, x2:680, y2:1440, stroke:"#302C3A", "stroke-width":6 });
// door frame (on top of the panels)
el(sceneG, "path", { d:"M 366 1500 L 366 636 L 714 636 L 714 1500", fill:"none", stroke:C.paper, "stroke-width":9, "stroke-linejoin":"round" });

// handrail (two segments, either side of the doorway)
el(sceneG, "line", { x1:100, y1:1160, x2:360, y2:1160, stroke:C.paper, "stroke-width":10, "stroke-linecap":"round" });
el(sceneG, "line", { x1:720, y1:1160, x2:980, y2:1160, stroke:C.paper, "stroke-width":10, "stroke-linecap":"round" });

// floor buttons column on the left wall (the 12 is lit)
const btnG = el(sceneG, "g", {});
for (let i = 0; i < 6; i++) el(btnG, "circle", { cx:160, cy:930 + i*52, r:14, fill: i === 0 ? C.volt : "none", stroke:C.paper, "stroke-width":5 });
el(btnG, "text", { x:160, y:938, "text-anchor":"middle", fill:C.ink, "font-family":"Archivo Black", "font-size":16 }).textContent = "12";

// HERO PROP: floor indicator on the back wall (bevelled housing + big digit + up arrow)
const indG = el(sceneG, "g", {});
el(indG, "rect", { x:430, y:478, width:220, height:128, rx:18, fill:"#0B0A0E", stroke:C.paper, "stroke-width":8 });
el(indG, "rect", { x:446, y:494, width:188, height:96, rx:10, fill:"#141218" });
const arrow = el(indG, "path", { d:"M 470 566 L 494 526 L 518 566 Z", fill:C.volt });
const digit = el(indG, "text", { x:582, y:576, "text-anchor":"middle", fill:C.volt, "font-family":"Archivo Black", "font-size":86 });
digit.textContent = "1";

// motion streaks for the dash
const streakG = el(sceneG, "g", { stroke:C.paper, "stroke-width":8, "stroke-linecap":"round", display:"none" });
const streaks = [];
for (let i = 0; i < 6; i++) streaks.push(el(streakG, "line", {}));

// impact burst at the collision (ring + 4 spokes)
const burstG = el(sceneG, "g", { display:"none" });
const burstRing = el(burstG, "circle", { cx:540, cy:1090, r:40, fill:"none", stroke:C.volt, "stroke-width":10 });
const spokes = [];
for (let i = 0; i < 6; i++) spokes.push(el(burstG, "line", { stroke:C.volt, "stroke-width":9, "stroke-linecap":"round" }));

/* ============================ characters ============================ */
const A = makeStick(sceneG, {});                  // A: the one who talks
const Bc = makeStick(sceneG, { tuft: C.pink });   // B: the one who answers in one syllable

/* expression channel (mouth) + follow-through channel (lanyard), both inside each rig group */
function addFace(s) {
  s.mouthPath = el(s.g, "path", { stroke:C.paper, "stroke-width":7, fill:"none", "stroke-linecap":"round" });
  s.mouthO = el(s.g, "ellipse", { fill:C.paper, display:"none" });
  // lanyard: cord + badge. Cord hangs from the neck point; badge orientation follows the cord.
  s.lanG = el(s.g, "g", {});
  s.cord = el(s.lanG, "line", { stroke:C.pink, "stroke-width":6, "stroke-linecap":"round" });
  s.badge = el(s.lanG, "g", {});
  el(s.badge, "rect", { x:-22, y:0, width:44, height:58, rx:6, fill:C.volt, stroke:C.ink, "stroke-width":3 });
  el(s.badge, "rect", { x:-13, y:10, width:26, height:22, rx:3, fill:C.ink });
  el(s.badge, "rect", { x:-15, y:40, width:30, height:5, rx:2, fill:C.ink });
}
addFace(A); addFace(Bc);
const watchG = el(A.g, "g", { display:"none" });
el(watchG, "rect", { x:-16, y:-11, width:32, height:22, rx:6, fill:C.panel, stroke:C.paper, "stroke-width":5 });

function headLocal(p) {
  const tTop = [dir(p.torso)[0] * L.torso, dir(p.torso)[1] * L.torso];
  const a = p.torso + (p.headTilt || 0);
  return [tTop[0] + dir(a)[0] * (L.neck + L.head * 0.9), tTop[1] + dir(a)[1] * (L.neck + L.head * 0.9)];
}
function setMouth(s, p, kind) {
  const hc = headLocal(p), f = p.face === undefined ? 1 : p.face;
  const mx = hc[0] + f * 12, my = hc[1] + 22;
  s.mouthPath.setAttribute("display", kind === "scream" ? "none" : "");
  s.mouthO.setAttribute("display", kind === "scream" ? "" : "none");
  if (kind === "grin")       s.mouthPath.setAttribute("d", `M ${mx-24} ${my-4} q 24 26 48 0`);
  else if (kind === "frown") s.mouthPath.setAttribute("d", `M ${mx-22} ${my+8} q 22 -22 44 0`);
  else if (kind === "flat")  s.mouthPath.setAttribute("d", `M ${mx-16} ${my} l 32 0`);
  else if (kind === "small") s.mouthPath.setAttribute("d", `M ${mx-10} ${my} q 10 8 20 0`);
  else if (kind === "tight") s.mouthPath.setAttribute("d", `M ${mx-12} ${my+2} q 12 -6 24 0`);
  if (kind === "scream") { s.mouthO.setAttribute("cx", mx); s.mouthO.setAttribute("cy", my + 6); s.mouthO.setAttribute("rx", 16); s.mouthO.setAttribute("ry", 22); }
}
/* lanyard follow-through: angle (deg from straight down) is a pure function of t --
   sum of decaying oscillations triggered at each impulse, plus a drag offset while
   the body is translating. The cord LAGS: every impulse below starts at zero and
   swings out, so the badge is still moving after the primary motion has settled. */
function lanyard(s, p, ang) {
  const tTop = [dir(p.torso)[0] * L.torso, dir(p.torso)[1] * L.torso];
  const neck = [tTop[0], tTop[1] + 18];
  const len = 118;
  const end = [neck[0] + dir(ang)[0] * len, neck[1] + dir(ang)[1] * len];
  s.cord.setAttribute("x1", neck[0]); s.cord.setAttribute("y1", neck[1]);
  s.cord.setAttribute("x2", end[0]); s.cord.setAttribute("y2", end[1]);
  s.badge.setAttribute("transform", `translate(${end[0].toFixed(1)},${end[1].toFixed(1)}) rotate(${(-ang).toFixed(1)})`);
}
const mirror = p => { const o = { ...p }; for (const k of ["rot","torso","headTilt","laU","laL","raU","raL","llU","llL","rlU","rlL"]) if (typeof o[k] === "number") o[k] = -o[k]; if (typeof o.face === "number") o.face = -o.face; if (o.px) o.px = -o.px; return o; };
const handPt = (u, l) => [dir(u)[0] * L.uArm + dir(l)[0] * L.lArm, -L.torso + dir(u)[1] * L.uArm + dir(l)[1] * L.lArm];

// endcard mini: a lit "12" call button
const endsvg = document.getElementById("endsvg");
el(endsvg, "circle", { cx:540, cy:420, r:78, fill:C.panel, stroke:C.volt, "stroke-width":9 });
el(endsvg, "path", { d:"M 512 436 L 540 392 L 568 436 Z", fill:C.volt });
el(endsvg, "text", { x:540, y:490, "text-anchor":"middle", fill:C.paper, "font-family":"Archivo Black", "font-size":34 }).textContent = "12";

/* ============================ ui handles ============================ */
const ui = { title:document.getElementById("title"),
  bubA1:document.getElementById("bubA1"), bubB1:document.getElementById("bubB1"),
  bubA2:document.getElementById("bubA2"), bubB2:document.getElementById("bubB2"),
  dog:document.getElementById("stampDog"), owl:document.getElementById("stampOwl"),
  cat:document.getElementById("catCard"), endcard:document.getElementById("endcard"),
  flash:document.getElementById("flash") };

/* ============================ shared car physics ============================ */
const GROUND = 1292;   // hip y standing on the floor
const AX = 300, BX = 780;
// vertical jolt felt by both occupants (start dip, stop bump), as decaying oscillations
function carJolt(t) { return shake(t, B.go, 16, 5.0, 2.4, 0) + shake(t, B.stop, -12, 5.5, 2.6, 0); }
function carSquash(t) { return punch(t, B.go, 0.06, 14) + punch(t, B.stop, 0.05, 14); }

/* ============================ character A ============================ */
function aLogic(t) {
  let p, mouth = "flat", watch = false;
  const base = { ...P.stand, tx:AX, ty:GROUND, face:0, eyes:"open", torso:180 };
  if (t < B.wind[0]) {
    p = { ...base };
    // face: forward -> B (turnA) -> forward (fwd) -> B again for line 2 -> forward (fwd2)
    let f = 0;
    if (t >= B.turnA[0] && t < B.fwd[0]) f = easeInOutQuad(ramp(t, B.turnA[0], B.turnA[1]));
    else if (t >= B.fwd[0] && t < B.bubA2 - 0.10) f = 1 - easeInOutQuad(ramp(t, B.fwd[0], B.fwd[1]));
    else if (t >= B.bubA2 - 0.10 && t < B.fwd2[0]) f = easeInOutQuad(ramp(t, B.bubA2 - 0.10, B.bubA2 + 0.10));
    else if (t >= B.fwd2[0]) f = 1 - easeInOutQuad(ramp(t, B.fwd2[0], B.fwd2[1]));
    p.face = f; p.headTilt = -7 * f;    // lean toward B while talking
    if (t >= B.bubA1 && t < B.bubA1 + 0.9) mouth = "small";
    if (t >= B.bubA2 && t < B.bubA2 + 1.0) mouth = "small";
    // hold #1: dead eyes, one slow blink
    if (t >= B.dead && t < B.bubA2 - 0.10) p.eyes = "dead";
    if (t >= B.blink - 0.08 && t <= B.blink + 0.14) p.eyes = "closed";
    // watch check: wrist up, eyes down-ish (dead), mouth tight
    if (t >= B.watch[0]) {
      const k = easeOutBack(ramp(t, B.watch[0], B.watch[1]));
      p.laU = lerp(14, 70, k); p.laL = lerp(8, 172, k);
      p.eyes = "dead"; mouth = "tight"; watch = true;
      p.ty = GROUND + Math.sin((t - B.watch[1]) * 1.4) * 2;
    }
    p.ty += carJolt(t); const cs = carSquash(t); p.sy = 1 - cs; p.sx = 1 + cs * 0.6; p.px = 0; p.py = 210;
    if (t >= B.ding2) { p.eyes = "wide"; mouth = "small"; }
  } else if (t < B.dash[0]) {
    // ANTICIPATION: lean away from the door (screen-left), knees bend
    const k = easeInOutQuad(ramp(t, B.wind[0], B.wind[1]));
    p = mixPose({ ...base, eyes:"wide" }, { ...P.stand, tx:AX - 30, ty:GROUND + 22, face:1, eyes:"wide", torso:192, llU:24, llL:-6, rlU:-16, rlL:6, laU:-50, laL:-30, raU:-36, raL:-16 }, k);
    p.eyes = "wide"; p.sy = 1 - 0.08*k; p.sx = 1 + 0.05*k; p.px = 0; p.py = 210; mouth = "small";
  } else if (t < B.hit) {
    // DASH right toward the doorway, stride stretch. Hips stop at 440 so the leaning head lands at ~524 (own side of centre)
    const k = ramp(t, B.dash[0], B.dash[1]);
    const ph = (t * 4.0) % 1;
    p = walkPose(ph); p.torso = 160; p.face = 1; p.eyes = "wide";
    p.laU = 100 + Math.sin(ph * TAU) * 40; p.laL = 40; p.raU = -40 + Math.sin(ph * TAU) * 40; p.raL = -20;
    p.tx = lerp(AX - 30, 440, k); p.ty = GROUND - Math.abs(Math.sin(ph * TAU)) * 14;
    const st = 0.06 + Math.abs(Math.sin(ph * TAU)) * 0.06; p.sx = 1 + st; p.sy = 1 - st * 0.7; p.px = 0; p.py = 210;
    mouth = "grin";
  } else if (t < B.squeeze[0]) {
    // COLLISION: 18% sideways squash, pivot at the contact edge (right side), 4-frame hold. Near-upright so the heads press, not cross.
    p = { ...P.stand, tx:452, ty:GROUND, face:1, eyes:"wide", torso:174, headTilt:-10, laU:110, laL:190, raU:-30, raL:-40, llU:14, llL:-6, rlU:-30, rlL:12 };
    const sq = 0.18;
    p.sx = 1 - sq; p.sy = 1 + sq * 0.8; p.px = 60; p.py = 210;
    mouth = "scream";
  } else {
    // SQUEEZE THROUGH: recover from the squash fast, then shrink into the corridor (pivot at the feet), fade
    const k = easeInCubic(ramp(t, B.squeeze[0], B.squeeze[1]));
    const rec = 1 - easeOutCubic(ramp(t, B.squeeze[0], B.squeeze[0] + 0.08));
    p = { ...P.sprint, tx: lerp(452, 515, k), ty: lerp(GROUND, 1290 - 130, k), face:1, eyes:"wide" };
    p.torso = 152; p.headTilt = 0;
    const s = lerp(1, 0.42, k);
    p.sx = s * (1 - 0.18 * rec); p.sy = s * (1 + 0.14 * rec); p.px = 0; p.py = 210;
    mouth = "scream";
    A.g.setAttribute("opacity", (1 - k).toFixed(3));
  }
  if (t < B.squeeze[0]) A.g.setAttribute("opacity", "1");
  A.g.setAttribute("display", t < B.squeeze[1] ? "" : "none");
  poseStick(A, p); setMouth(A, p, mouth);
  watchG.setAttribute("display", watch ? "" : "none");
  if (watch) { const h = handPt(p.laU, p.laL); watchG.setAttribute("transform", `translate(${h[0].toFixed(1)},${h[1].toFixed(1)}) rotate(-20)`); }
  // FOLLOW-THROUGH: lanyard lags the body. Impulses at go / stop / dash launch / collision, drag while dashing.
  let ang = shake(t, B.go, 22, 3.2, 1.5, 0) + shake(t, B.stop, -16, 3.6, 1.6, 0)
          + shake(t, B.wind[0], 10, 4, 2.0, 0)
          + shake(t, B.hit, 34, 6.5, 3.0, Math.PI * 0.5);           // swings forward through the contact
  if (t >= B.dash[0] && t < B.hit) ang += -34 * easeOutCubic(ramp(t, B.dash[0], B.dash[0] + 0.12)) + Math.sin(t * TAU * 4) * 6; // trails behind a right-moving body
  lanyard(A, p, ang);
  return p;
}

/* ============================ character B ============================ */
function bLogic(t) {
  let p, mouth = "flat";
  const base = { ...P.stand, tx:BX, ty:GROUND, face:0, eyes:"open", torso:180 };
  if (t < B.wind[0]) {
    p = { ...base };
    let f = 0;
    if (t >= B.turnB[0] && t < B.fwd[0]) f = -easeInOutQuad(ramp(t, B.turnB[0], B.turnB[1]));
    else if (t >= B.fwd[0] && t < B.nod[0] - 0.15) f = -(1 - easeInOutQuad(ramp(t, B.fwd[0], B.fwd[1])));
    else if (t >= B.nod[0] - 0.15 && t < B.fwd2[0]) f = -easeInOutQuad(ramp(t, B.nod[0] - 0.15, B.nod[0]));
    else if (t >= B.fwd2[0] && t < B.wander[0]) f = -(1 - easeInOutQuad(ramp(t, B.fwd2[0], B.fwd2[1])));
    else if (t >= B.wander[0]) f = Math.sin((t - B.wander[0]) * 1.1) * 0.7 * ramp(t, B.wander[0], B.wander[0] + 0.4);   // eyes wander, never at A
    p.face = f; p.headTilt = t < B.wander[0] ? -7 * f : 0;
    if (t >= B.bubB1 && t < B.bubB1 + 0.35) mouth = "tight";
    if (t >= B.dead && t < B.nod[0] - 0.15) p.eyes = "dead";
    // two-dip nod: quick dip, tiny rise, second dip (ANTICIPATION-shaped), mouth closes on "Mm."
    if (t >= B.nod[0] && t < B.nod[1] + 0.2) {
      const k = (t - B.nod[0]) / (B.nod[1] - B.nod[0]);
      p.ty = GROUND + Math.max(0, Math.sin(k * TAU)) * 22;
      p.torso = 180 - Math.max(0, Math.sin(k * TAU)) * 6;
      if (t >= B.bubB2) mouth = "tight";
    }
    if (t >= B.wander[0]) { p.eyes = "open"; mouth = "flat"; }
    p.ty += carJolt(t); const cs = carSquash(t); p.sy = 1 - cs; p.sx = 1 + cs * 0.6; p.px = 0; p.py = 210;
    if (t >= B.ding2) { p.eyes = "wide"; mouth = "small"; p.face = 0; }
  } else if (t < B.dash[0]) {
    // ANTICIPATION: lean away from the door (screen-right) -- mirror of A's windup
    const k = easeInOutQuad(ramp(t, B.wind[0], B.wind[1]));
    const tgt = mirror({ ...P.stand, face:1, eyes:"wide", torso:192, llU:24, llL:-6, rlU:-16, rlL:6, laU:-50, laL:-30, raU:-36, raL:-16 });
    tgt.torso = 168;   // mirror() gives -192; mixPose would lerp 180 -> -192 the long way (through 0 = pointing down). 168 is the same direction, lerp-safe.
    p = mixPose({ ...base, eyes:"wide" }, { ...tgt, tx:BX + 30, ty:GROUND + 22, eyes:"wide" }, k);
    p.eyes = "wide"; p.sy = 1 - 0.08*k; p.sx = 1 + 0.05*k; p.px = 0; p.py = 210; mouth = "small";
  } else if (t < B.hit) {
    // DASH left toward the same doorway (mirrored stride)
    const k = ramp(t, B.dash[0], B.dash[1]);
    const ph = (t * 4.0 + 0.5) % 1;
    p = walkPose(ph); p.torso = 160; p.face = 1; p.eyes = "wide";
    p.laU = 100 + Math.sin(ph * TAU) * 40; p.laL = 40; p.raU = -40 + Math.sin(ph * TAU) * 40; p.raL = -20;
    p = mirror(p);
    p.tx = lerp(BX + 30, 640, k); p.ty = GROUND - Math.abs(Math.sin(ph * TAU)) * 14;
    const st = 0.06 + Math.abs(Math.sin(ph * TAU)) * 0.06; p.sx = 1 + st; p.sy = 1 - st * 0.7; p.px = 0; p.py = 210;
    mouth = "grin";
  } else if (t < B.squeeze[0]) {
    // COLLISION: mirrored squash, pivot at the contact edge (left side)
    p = mirror({ ...P.stand, face:1, eyes:"wide", torso:174, headTilt:-10, laU:110, laL:190, raU:-30, raL:-40, llU:14, llL:-6, rlU:-30, rlL:12 });
    p.tx = 628; p.ty = GROUND;
    const sq = 0.18;
    p.sx = 1 - sq; p.sy = 1 + sq * 0.8; p.px = -60; p.py = 210;
    mouth = "scream";
  } else {
    const k = easeInCubic(ramp(t, B.squeeze[0], B.squeeze[1]));
    const rec = 1 - easeOutCubic(ramp(t, B.squeeze[0], B.squeeze[0] + 0.08));
    p = mirror({ ...P.sprint, face:1, eyes:"wide" });
    p.tx = lerp(628, 565, k); p.ty = lerp(GROUND, 1290 - 130, k); p.eyes = "wide"; p.torso = -152; p.headTilt = 0;
    const s = lerp(1, 0.42, k);
    p.sx = s * (1 - 0.18 * rec); p.sy = s * (1 + 0.14 * rec); p.px = 0; p.py = 210;
    mouth = "scream";
    Bc.g.setAttribute("opacity", (1 - k).toFixed(3));
  }
  if (t < B.squeeze[0]) Bc.g.setAttribute("opacity", "1");
  Bc.g.setAttribute("display", t < B.squeeze[1] ? "" : "none");
  poseStick(Bc, p); setMouth(Bc, p, mouth);
  let ang = shake(t, B.go, 18, 3.0, 1.4, 0.3) + shake(t, B.stop, -14, 3.4, 1.7, 0.2)
          + shake(t, B.wind[0], -10, 4, 2.0, 0)
          + shake(t, B.hit, -34, 6.5, 3.0, Math.PI * 0.5);
  if (t >= B.dash[0] && t < B.hit) ang += 34 * easeOutCubic(ramp(t, B.dash[0], B.dash[0] + 0.12)) + Math.sin(t * TAU * 4 + 1) * 6;  // trails behind a left-moving body
  lanyard(Bc, p, ang);
  return p;
}

/* ============================ car: doors, indicator, streaks, burst ============================ */
function floorAt(t) { let f = 1; for (const [tt, fl] of TICKS) if (t >= tt) f = fl; return f; }
function lastTick(t) { let tt = -9; for (const [x] of TICKS) if (t >= x) tt = x; return tt; }
function carLogic(t) {
  // doors: k = 1 closed, 0 open
  let k;
  if (t < B.doorsClose[0]) k = 0.10;
  else if (t < B.doorsOpen[0]) k = easeInOutQuad(ramp(t, B.doorsClose[0], B.doorsClose[1])) * 0.9 + 0.10;
  else if (t < B.doorsClose2[0]) k = 1 - easeOutCubic(ramp(t, B.doorsOpen[0], B.doorsOpen[1]));
  else k = easeInOutQuad(ramp(t, B.doorsClose2[0], B.doorsClose2[1]));
  doorL.setAttribute("transform", `translate(${(-170 * (1 - k)).toFixed(1)},0)`);
  doorR.setAttribute("transform", `translate(${(170 * (1 - k)).toFixed(1)},0)`);
  // indicator digit: pop on each tick; arrow blinks while moving; flash on both dings
  const fl = floorAt(t);
  digit.textContent = String(fl);
  const pop = 1 + punch(t, lastTick(t), 0.22, 14);
  digit.setAttribute("transform", `translate(582,576) scale(${pop.toFixed(3)}) translate(-582,-576)`);
  const moving = t >= B.go && t < B.stop;
  arrow.setAttribute("opacity", moving ? (Math.floor(t * 2) % 2 ? 1 : 0.25) : (t >= B.stop ? 0.25 : 1));
  const dingOn = (t >= B.ding1 && t < B.ding1 + 0.25) || (t >= B.ding2 && t < B.ding2 + 0.3);
  digit.setAttribute("fill", dingOn ? C.paper : C.volt);
  lamp.setAttribute("fill", dingOn ? C.volt : "#EDE9DA");
  // dash streaks (behind each runner)
  const dashing = t >= B.dash[0] + 0.04 && t < B.hit;
  streakG.setAttribute("display", dashing ? "" : "none");
  if (dashing) {
    const k = ramp(t, B.dash[0], B.dash[1]);
    const ax = lerp(AX - 34, 480, k), bx = lerp(BX + 34, 600, k);
    for (let i = 0; i < 3; i++) {
      const y = 1080 + i * 90, len = 90 + i * 30;
      streaks[i].setAttribute("x1", ax - 70); streaks[i].setAttribute("x2", ax - 70 - len); streaks[i].setAttribute("y1", y); streaks[i].setAttribute("y2", y);
      streaks[i + 3].setAttribute("x1", bx + 70); streaks[i + 3].setAttribute("x2", bx + 70 + len); streaks[i + 3].setAttribute("y1", y); streaks[i + 3].setAttribute("y2", y);
    }
    streakG.setAttribute("opacity", (0.35 + 0.45 * k).toFixed(2));
  }
  // impact burst
  const bt = t - B.hit;
  const burst = bt >= 0 && bt < 0.32;
  burstG.setAttribute("display", burst ? "" : "none");
  if (burst) {
    const k = easeOutCubic(bt / 0.32);
    burstRing.setAttribute("r", (30 + 150 * k).toFixed(1)); burstRing.setAttribute("opacity", (1 - k).toFixed(2));
    burstRing.setAttribute("stroke-width", (12 * (1 - k) + 2).toFixed(1));
    for (let i = 0; i < 6; i++) {
      const a = i * 60 + 30, r0 = 50 + 150 * k, r1 = r0 + 40 + 40 * (1 - k);
      spokes[i].setAttribute("x1", 540 + Math.cos(a * D2R) * r0); spokes[i].setAttribute("y1", 1090 + Math.sin(a * D2R) * r0);
      spokes[i].setAttribute("x2", 540 + Math.cos(a * D2R) * r1); spokes[i].setAttribute("y2", 1090 + Math.sin(a * D2R) * r1);
      spokes[i].setAttribute("opacity", (1 - k).toFixed(2));
    }
  }
}

/* ============================ camera + flash ============================ */
const PUNCHES = [[B.go, 0.03, 10], [B.dogStamp, 0.03, 10], [B.dash[0], 0.05, 9], [B.hit, 0.06, 10], [B.catCard, 0.05, 9]];
const SHAKES = [[B.go, 4, 42, 0.4], [B.stop, 5, 44, 0.9], [B.hit, 7, 50, 1.0]];
const cam = document.getElementById("cam");
function doCam(t) {
  let s = 1;
  for (const [t0, a, d] of PUNCHES) s += punch(t, t0, a, d);
  s += 0.04 * easeInOutQuad(ramp(t, B.hold1[0], B.hold1[1]));            // slow push-in through the dead stare
  if (t >= B.bubA2) s += 0.04 * (1 - easeInOutQuad(ramp(t, B.bubA2, B.bubA2 + 0.3))) - 0.04;
  s += 0.05 * easeInOutQuad(ramp(t, B.empty[0], B.empty[1]));            // creep in on the empty car
  if (t >= B.catCard) s -= 0.05;
  let x = 0, y = 0;
  for (const [t0, a, f, ph] of SHAKES) { x += shake(t, t0, a, 6.5, f, ph); y += shake(t, t0, a*0.8, 6.5, f*1.13, ph+0.7); }
  cam.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${s.toFixed(4)})`;
  cam.style.transformOrigin = "540px 1100px";
}

/* ============================ master seek ============================ */
window.seek = async (t) => {
  t = clamp(t, 0, B.end);
  stalePaintGuard(t, bgflip, document.getElementById("ui"));
  const endOn = t >= B.endcard;
  ui.endcard.style.visibility = endOn ? "visible" : "hidden";
  sceneG.style.visibility = endOn ? "hidden" : "visible";
  if (!endOn) { carLogic(t); aLogic(t); bLogic(t); }
  doCam(endOn ? 0 : t);
  // hit flash is ONE frame (decay 45) so the collision hold stays readable, not tinted
  ui.flash.style.opacity = endOn ? 0 : (punch(t, B.ding2, 0.45, 14) + punch(t, B.hit, 0.30, 45)).toFixed(3);

  // overlays
  if (t < B.catCard) snapIn(ui.title, t, B.title, 0.15, 0); else ui.title.style.visibility = "hidden";
  if (t >= B.bubA1 && t < B.fwd[0]) snapIn(ui.bubA1, t, B.bubA1, 0.12, -2); else ui.bubA1.style.visibility = "hidden";
  if (t >= B.bubB1 && t < B.fwd[0]) snapIn(ui.bubB1, t, B.bubB1, 0.10, 2); else ui.bubB1.style.visibility = "hidden";
  if (t >= B.bubA2 && t < B.fwd2[0]) snapIn(ui.bubA2, t, B.bubA2, 0.12, -2); else ui.bubA2.style.visibility = "hidden";
  if (t >= B.bubB2 && t < B.fwd2[0]) snapIn(ui.bubB2, t, B.bubB2, 0.10, 2); else ui.bubB2.style.visibility = "hidden";
  if (t >= B.dogStamp && t < B.owlStamp - 0.10) snapIn(ui.dog, t, B.dogStamp, 0.13, -4); else ui.dog.style.visibility = "hidden";
  if (t >= B.owlStamp && t < B.ding2 - 0.10) snapIn(ui.owl, t, B.owlStamp, 0.13, 4); else ui.owl.style.visibility = "hidden";
  if (t >= B.catCard && t < B.endcard) snapIn(ui.cat, t, B.catCard, 0.16, 0); else ui.cat.style.visibility = "hidden";
  await compositorCommit();
};
window.seek(0);
</script></body></html>
