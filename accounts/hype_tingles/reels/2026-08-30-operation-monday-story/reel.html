<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family:'Archivo Black'; src:url('../../brand/fonts/archivo-black-400.woff2') format('woff2'); font-weight:400; }
@font-face { font-family:'Space Grotesk'; src:url('../../brand/fonts/space-grotesk-400.woff2') format('woff2'); font-weight:400; }
@font-face { font-family:'Space Grotesk'; src:url('../../brand/fonts/space-grotesk-500.woff2') format('woff2'); font-weight:500; }
@font-face { font-family:'Space Grotesk'; src:url('../../brand/fonts/space-grotesk-700.woff2') format('woff2'); font-weight:700; }

:root { --ink:#111015; --volt:#D8FF3A; --pink:#FF4D9D; --paper:#F4F2EC; --soft:#9A96A3; --bubble:#1C1A24; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1920px; overflow:hidden; }
body { background:var(--ink); color:var(--paper); font-family:'Space Grotesk',Arial,sans-serif; position:relative; }
body::before { content:""; position:absolute; width:1100px; height:1100px; right:-480px; top:-480px;
  background:radial-gradient(circle, rgba(255,77,157,0.14) 0%, rgba(255,77,157,0) 62%); pointer-events:none; z-index:0; }

/* ---------- title ---------- */
#title { position:absolute; inset:0; z-index:20; background:var(--ink); display:flex; flex-direction:column;
  justify-content:center; align-items:center; text-align:center; padding:0 100px; }
#t-wordmark { font-family:'Archivo Black'; font-size:52px; color:var(--volt); }
#t-wordmark .tingle { color:var(--pink); }
#t-pres { color:var(--soft); font-size:32px; font-weight:500; letter-spacing:.3em; margin-top:26px; }
#t-main { font-family:'Archivo Black'; font-size:150px; line-height:1.02; margin-top:60px; }
#t-main .m2 { color:var(--volt); }
#t-sub { font-size:44px; font-weight:500; color:var(--paper); margin-top:64px; line-height:1.4; }
#t-sub .q { color:var(--pink); font-weight:700; }

/* ---------- chat chrome ---------- */
#chatbar { position:absolute; top:0; left:0; right:0; z-index:10; background:#16141C;
  border-bottom:3px solid #26232E; padding:120px 70px 34px; }
#chatname { font-family:'Archivo Black'; font-size:52px; letter-spacing:.02em; }
#chatname .paw { color:var(--volt); }
#chatsub { color:var(--soft); font-size:30px; font-weight:500; margin-top:12px; letter-spacing:.05em; }
#chatsub .typ { color:var(--pink); }

#feedwrap { position:absolute; top:300px; bottom:300px; left:0; right:0; overflow:hidden;
  display:flex; flex-direction:column; justify-content:flex-end; padding:0 60px 30px; z-index:5; }

.msg { display:none; margin-top:34px; max-width:820px; }
.msg .who { font-family:'Archivo Black'; font-size:30px; margin:0 0 10px 26px; }
.msg .bub { background:var(--bubble); border:2px solid #2A2733; border-radius:34px 34px 34px 10px;
  padding:34px 42px; font-size:44px; line-height:1.3; font-weight:500; width:fit-content; }
.msg .em { margin-right:14px; font-family:'Segoe UI Emoji'; }
.msg.sys { align-self:center; max-width:none; }
.msg.sys .bub { background:none; border:none; color:var(--soft); font-size:32px; letter-spacing:.16em;
  text-transform:uppercase; font-weight:500; padding:20px 0 6px; }
.msg.cat { align-self:flex-start; }
.msg.cat .bub { background:#0F0E13; border-color:var(--volt); font-size:52px; font-weight:700; }

.c-dog  { color:#FFB03A; } .c-owl { color:#9D8DF1; } .c-pig { color:#5AD7FF; }
.c-gold { color:#FF9A62; } .c-rac { color:#7DFFA8; } .c-slo { color:#C7B9FF; } .c-cat { color:var(--volt); }

#typing { display:none; margin-top:34px; }
#typing .bub { background:var(--bubble); border:2px solid #2A2733; border-radius:34px 34px 34px 10px;
  padding:34px 48px; width:fit-content; color:var(--soft); font-size:44px; letter-spacing:.3em; }

/* ---------- endcard ---------- */
#end { position:absolute; inset:0; z-index:30; background:var(--ink); display:flex; flex-direction:column;
  justify-content:center; align-items:center; text-align:center; }
#e-main { font-family:'Archivo Black'; font-size:104px; line-height:1.1; }
#e-main .accent { color:var(--pink); }
#e-handle { background:var(--volt); color:var(--ink); font-family:'Archivo Black'; font-size:52px;
  padding:30px 56px; border-radius:20px; margin-top:76px; }
#e-sub { color:var(--soft); font-size:36px; font-weight:500; letter-spacing:.2em; margin-top:50px; }
</style></head>
<body>

<div id="chatbar">
  <div id="chatname">COUNCIL OF ANIMALS <span class="paw">&#128062;</span></div>
  <div id="chatsub">7 members &#183; <span id="slothtyp" class="typ" style="visibility:hidden">The Sloth is typing&#8230;</span></div>
</div>

<div id="feedwrap"><div id="feed"></div><div id="typing"><div class="who"></div><div class="bub">&#8226; &#8226; &#8226;</div></div></div>

<div id="title">
  <div id="t-wordmark">HYPE <span class="tingle">TINGLE</span></div>
  <div id="t-pres">PRESENTS</div>
  <div id="t-main">OPERATION<br><span class="m2">MONDAY</span></div>
  <div id="t-sub">Our human said <span class="q">&#8220;gym starts Monday.&#8221;</span><br>The group chat had thoughts.</div>
</div>

<div id="end" style="opacity:0">
  <div id="e-main">THE COUNCIL<br>MEETS <span class="accent">DAILY.</span></div>
  <div id="e-handle">@hype_tingles</div>
  <div id="e-sub">FOLLOW FOR THE MINUTES</div>
</div>

<script>
window.REEL = { duration: 121.0, fps: 30 };
const $ = id => document.getElementById(id);
const c01 = p => Math.max(0, Math.min(1, p));
const easeOut = p => 1 - Math.pow(1 - p, 3);
const back = p => { const c=1.70158, c3=c+1; return 1 + c3*Math.pow(p-1,3) + c*Math.pow(p-1,2); };
const P = (t, t0, d, e) => { const p = c01((t - t0) / d); return e ? e(p) : p; };

const CAST = {
  dog:  {name:'THE DOG',      cls:'c-dog',  em:'\u{1F436}'},
  owl:  {name:'THE OWL',      cls:'c-owl',  em:'\u{1F989}'},
  pig:  {name:'THE PIGEON',   cls:'c-pig',  em:'\u{1F54A}️'},
  gold: {name:'THE GOLDFISH', cls:'c-gold', em:'\u{1F420}'},
  rac:  {name:'THE RACCOON',  cls:'c-rac',  em:'\u{1F99D}'},
  slo:  {name:'THE SLOTH',    cls:'c-slo',  em:'\u{1F9A5}'},
  cat:  {name:'THE CAT',      cls:'c-cat',  em:'\u{1F63E}'},
};

// [gap_seconds_before, who, text]  -- 'sys' = system line
const SCRIPT = [
  [0.0,  'dog', 'HE SAID IT AGAIN'],
  [1.6,  'dog', 'GYM. MONDAY. I AM SO PROUD'],
  [2.6,  'owl', 'That is the 47th Monday he has announced.'],
  [2.9,  'owl', 'I keep records. I will not show them.'],
  [2.3,  'gold','who is this'],
  [2.4,  'pig', 'I once flew into a window and kept going. He can too.'],
  [3.1,  'rac', 'Update: his dumbbells are sold. They were dusty. Legally fine.'],
  [3.1,  'dog', 'WE SHOULD HELP HIM'],
  [2.0,  'sys', 'The Sloth started typing'],
  [2.6,  'owl', 'Proposal: OPERATION MONDAY. We make him actually go.'],
  [3.2,  'pig', 'I handle the wake-up. I know a spot on his window. 5 AM.'],
  [3.0,  'gold','wait. who is he'],
  [2.3,  'rac', 'I can source a treadmill tonight. Do not ask from where.'],
  [3.0,  'dog', 'I WILL DO THE HYPE. IT IS MY WHOLE PERSONALITY'],
  [2.9,  'owl', 'Phase one: hide the snooze button.'],
  [2.6,  'pig', 'Phase two: I scream.'],
  [2.6,  'sys', 'Monday, 5:00 AM'],
  [2.2,  'pig', 'SCREAMING HAS COMMENCED'],
  [2.4,  'dog', 'HE IS UP. HE LOOKED AT HIS SHOES'],
  [2.6,  'owl', 'Shoe eye contact. Stage two of nine.'],
  [2.9,  'rac', 'Treadmill acquired. Also a lawyer. Unrelated.'],
  [3.0,  'gold','good morning everyone. what are we doing'],
  [2.6,  'dog', 'THE SHOES ARE ON. THE SHOES ARE ON'],
  [2.6,  'pig', 'I believe in him. I believe in everything I do.'],
  [2.7,  'sys', '5:47 AM'],
  [2.2,  'dog', 'he sat back down'],
  [1.7,  'dog', 'guys'],
  [1.7,  'dog', 'he is watching gym videos. in bed.'],
  [2.8,  'owl', 'Observation: that is not the gym.'],
  [2.7,  'rac', 'I can drag him there. I have dragged heavier.'],
  [3.0,  'gold','maybe watching counts. it does not. i forgot my point.'],
  [3.0,  'pig', 'NEW PLAN. I TAKE THE PHONE.'],
  [2.4,  'pig', 'I HAVE THE PHONE'],
  [2.2,  'dog', 'HE IS CHASING YOU'],
  [1.9,  'dog', 'HE IS RUNNING'],
  [2.5,  'owl', 'Gentlemen. He is running.'],
  [2.7,  'rac', 'Cardio achieved. Invoice sent.'],
  [2.5,  'dog', 'I AM SO PROUD OF HIM'],
  [2.6,  'sys', 'The Cat is online'],
  [4.2,  'cat', 'He needed a reason. Not a Monday.'],
  [3.8,  'sys', 'The Cat has left the chat'],
  [3.0,  'slo', 'good luck at the gym tomorrow'],
];

// build DOM + absolute times
const T0 = 6.2;                 // chat starts after title
let t = T0;
const msgs = SCRIPT.map(([gap, who, text]) => {
  t += gap;
  const el = document.createElement('div');
  if (who === 'sys') {
    el.className = 'msg sys';
    el.innerHTML = '<div class="bub">' + text + '</div>';
  } else {
    const c = CAST[who];
    el.className = 'msg' + (who === 'cat' ? ' cat' : '');
    el.innerHTML = '<div class="who ' + c.cls + '">' + c.name +
      '</div><div class="bub"><span class="em">' + c.em + '</span>' + text + '</div>';
  }
  $('feed').appendChild(el);
  return { t: t, who: who, el: el };
});
const CAT_T = msgs[39].t;        // cat message
const CAT_ON = msgs[38].t;       // "cat is online"
const END_T = 116.4;             // endcard start

window.seek = function (tt) {
  // title 0 - 6.2
  const ti = $('title');
  if (tt < 6.2) {
    ti.style.opacity = String(Math.min(1, 1 - P(tt, 5.7, 0.5)));
    ti.style.display = 'flex';
    $('t-wordmark').style.opacity = String(P(tt, 0.1, 0.3));
    $('t-pres').style.opacity = String(P(tt, 0.4, 0.3));
    const p = P(tt, 0.8, 0.5, back);
    $('t-main').style.opacity = String(P(tt, 0.8, 0.25));
    $('t-main').style.transform = 'scale(' + (0.8 + 0.2 * p) + ')';
    $('t-sub').style.opacity = String(P(tt, 2.2, 0.5));
  } else ti.style.display = 'none';

  // messages
  msgs.forEach(m => {
    if (tt >= m.t) {
      m.el.style.display = 'block';
      const p = P(tt, m.t, 0.32, back);
      m.el.style.opacity = String(P(tt, m.t, 0.18));
      m.el.style.transform = 'translateY(' + (1 - p) * 26 + 'px) scale(' + (0.92 + 0.08 * p) + ')';
    } else m.el.style.display = 'none';
  });

  // typing indicator for the next non-system message
  const nxt = msgs.find(m => m.who !== 'sys' && tt < m.t && tt >= m.t - 1.0);
  const ty = $('typing');
  if (nxt && tt >= 6.2) {
    ty.style.display = 'block';
    const c = CAST[nxt.who];
    ty.querySelector('.who').className = 'who ' + c.cls;
    ty.querySelector('.who').textContent = c.name;
  } else ty.style.display = 'none';

  // sloth running gag: "typing" from its start until its message lands
  $('slothtyp').style.visibility = (tt >= msgs[8].t && tt < msgs[41].t) ? 'visible' : 'hidden';

  // cat takeover: dim everything except the cat's own lines
  const dimP = (tt >= CAT_ON && tt < msgs[41].t - 0.4)
    ? Math.min(P(tt, CAT_ON, 0.8), 1 - P(tt, msgs[40].t + 1.6, 1.0)) : 0;
  msgs.forEach((m, i) => {
    if (i >= 38 && i <= 40) return;
    if (m.el.style.display !== 'none') {
      const cur = parseFloat(m.el.style.opacity || '1');
      m.el.style.opacity = String(cur * (1 - 0.78 * dimP));
    }
  });
  $('chatbar').style.opacity = String(1 - 0.5 * dimP);

  // endcard
  const end = $('end');
  if (tt >= END_T) {
    end.style.opacity = String(P(tt, END_T, 0.5));
    const p = P(tt, END_T + 0.15, 0.45, back);
    $('e-main').style.transform = 'scale(' + (0.85 + 0.15 * p) + ')';
    $('e-handle').style.opacity = String(P(tt, END_T + 0.7, 0.3));
    $('e-sub').style.opacity = String(P(tt, END_T + 1.1, 0.3));
  } else end.style.opacity = '0';
};
window.seek(0);

// expose message times for the audio-spec generator
window.MSG_TIMES = msgs.map(m => ({ t: m.t, who: m.who }));
</script>
</body></html>
